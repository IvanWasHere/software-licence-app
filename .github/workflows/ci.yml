name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# A runner has no `.env`, and `.env.test` only carries the values that differ
# in tests. Everything `start/env.ts` demands unconditionally therefore has to
# be supplied here, or `node ace` refuses to boot at all.
env:
  APP_KEY: ci_only_key_do_not_use_in_production
  NODE_ENV: test
  PORT: 3333
  HOST: localhost
  LOG_LEVEL: warn
  APP_URL: http://localhost:3333
  # The suite writes and compares UTC throughout and fails in any other zone.
  # Runners happen to be UTC already; pinning it means that staying true is not
  # luck.
  TZ: UTC

jobs:
  # The JS SDK (licence plan M6) — its own package, tested on every Node it
  # promises to run on. The contract test against the real server lives in
  # the server suite below (tests/functional/sdk), which imports the source.
  sdk-js:
    name: JS SDK (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    defaults:
      run:
        working-directory: sdk/js
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sdk/js/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/size.mjs

  # The PHP SDK (licence plan M7), on the oldest PHP it promises and the
  # newest. Its contract test against the real server runs in the server
  # suite below (tests/functional/sdk/php_sdk.spec.ts), which is why that job
  # installs PHP too.
  sdk-php:
    name: PHP SDK (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.4']
    defaults:
      run:
        working-directory: sdk/php
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium, curl, json
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: composer lint
      - run: composer test

  static:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  test:
    name: Test (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]

    # The portability rules in CONTRIBUTING.md are only enforced if the suite
    # actually runs on both engines, so this matrix is not optional.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # The PHP SDK's contract test drives the real PHP client against this
      # server; without PHP it skips, which CI must not.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sodium, curl, json
          coverage: none

      # The browser suite drives a real Chromium (plan §15). `--with-deps`
      # installs the shared libraries a headless browser needs on a runner
      # that has none of them; without it the suite fails at launch rather
      # than on an assertion.
      - name: Install the browser the browser tests drive
        run: npx playwright install --with-deps chromium

      - name: Run migrations
        run: node ace migration:run --force
        env:
          DB_CONNECTION: ${{ matrix.database }}
          DB_SQLITE_PATH: ./tmp/db.sqlite3
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/app_test

      - name: Run tests
        run: npm test
        env:
          DB_CONNECTION: ${{ matrix.database }}
          DB_SQLITE_PATH: ./tmp/db.sqlite3
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/app_test

  image:
    name: Build the image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The Dockerfile is part of the deliverable (plan §16), and it breaks
      # the same way any other build does — a dependency that needs a
      # toolchain, a file that stopped being copied. Built here, never
      # pushed: this job's product is the knowledge that it still builds.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
